image: node:24

build:
    stage: build
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules/
    script:
        # Configure the required VITE_* values in Settings > CI/CD > Variables.
        - npm ci
        - npm run build
        - rm -rf public
        - mv dist public
    artifacts:
        paths:
            - public

pages:
    stage: deploy
    dependencies:
        - build
    script:
        - test -d public
    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
