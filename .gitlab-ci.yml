image: node:24

build:
    stage: build
    variables:
        NEXT_PUBLIC_SITE_URL: https://ferdousanam.gitlab.io
        NEXT_TELEMETRY_DISABLED: "1"
    cache:
        key:
            files:
                - package-lock.json
        paths:
            - node_modules/
            - .next/cache/
    script:
        - npm ci
        - npm run build
        - rm -rf public
        - mv out public
    artifacts:
        paths:
            - public

pages:
    stage: deploy
    dependencies:
        - build
    script:
        - test -d public
    artifacts:
        paths:
            - public
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
