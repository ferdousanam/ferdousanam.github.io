<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — Ferdous Anam</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: #e7edf9;
            text-align: center;
            background:
                radial-gradient(900px 620px at 88% -6%, rgba(99, 102, 241, 0.24), transparent 62%),
                radial-gradient(720px 560px at -8% 18%, rgba(6, 182, 212, 0.13), transparent 60%),
                #070b16;
        }

        main {
            max-width: 520px;
        }

        .code {
            font-size: clamp(4.5rem, 18vw, 8rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.07em;
            background: linear-gradient(135deg, #818cf8, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h1 {
            margin: 1rem 0 0.75rem;
            font-size: clamp(1.5rem, 4vw, 2rem);
            letter-spacing: -0.03em;
        }

        p {
            margin: 0 0 1.75rem;
            line-height: 1.7;
            color: #9aa7bd;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 1.4rem;
            font-weight: 650;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #4f46e5, #7c3aed 48%, #06b6d4);
            border-radius: 0.9rem;
            box-shadow: 0 16px 36px rgba(99, 102, 241, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 44px rgba(99, 102, 241, 0.45);
        }
    </style>
</head>
<body>
<main>
    <div class="code">404</div>
    <h1>This page went off the map.</h1>
    <p>The page you are looking for does not exist or has been moved. Let's get you back to the portfolio.</p>
    <a href="/">Back to home</a>
</main>
</body>
</html>
